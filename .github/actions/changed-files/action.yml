---
name: Determine what files have changed on either a pull request or commit.
description: |
  Determine what files have changed on either a pull request or commit.
  Writes the list of files to

inputs:
  github-token:
    description: A preferred Github token to access private modules if necessary.
  sync-policy:
    description: |
      The name of a sync policy in .release/pipeline.hcl. If set we'll also include any changed files
      that the policy disallows in the changed-files output. We won't fail if there are any. That's
      up to the caller.

outputs:
  changed-files:
    description: |
      All of the files that changed and their groups as JSON, e.g. {"files": [], "groups": []}. If a
      sync-policy is set we'll also include "disallowed_files" and "disallowed_groups" if any changed
      files are disallowed.
    value: ${{ steps.changed-files.outputs.changed-files }}

runs:
  using: composite
  steps:
    - id: changed-files-set-up-pipeline
      name: Set up the pipeline tool
      uses: ./.github/actions/set-up-pipeline
      with:
        github-token: ${{ inputs.github-token || github.token }}
    - id: changed-files
      name: Determine the changed files
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        # Get a list of changed files and write the "changed-files" output to $GITHUB_OUTPUT
        if [ '${{ github.event_name }}' = 'pull_request' ]; then
          pipeline github list changed-files ${{ runner.debug && '--log debug' }} \
            --owner hashicorp \
            --repo '${{ github.event.pull_request.head.repo.name }}' \
            --pr '${{ github.event.pull_request.number }}' \
            ${{ inputs.sync-policy && format('--sync-policy {0}', inputs.sync-policy) }} \
            --github-output
        else
          pipeline github list changed-files ${{ runner.debug && '--log debug' }}\
            --owner hashicorp \
            --repo '${{ github.event.repository.name }}' \
            --commit '${{ github.event.after && github.event.after || github.event.push.after && github.event.push.after || github.sha }}' \
            ${{ inputs.sync-policy && format('--sync-policy {0}', inputs.sync-policy) }} \
            --github-output
        fi
