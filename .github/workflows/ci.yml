name: CI
on:
  pull_request:
    # The default types for pull_request are [opened, synchronize, reopened]. This is insufficient
    # for our needs, since we're skipping stuff on PRs in draft mode.By adding the ready_for_review
    # type, when a draft pr is marked ready, we run everything, including the stuff we'd have
    # skipped up until now.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - release/**
      - ce/**
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}-ci
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed-files }}
      checkout-ref: ${{ steps.checkout.outputs.ref }}
      compute-build: ${{ steps.metadata.outputs.compute-build }}
      compute-small: ${{ steps.metadata.outputs.compute-small }}
      compute-test-go: ${{ steps.metadata.outputs.compute-test-go }}
      compute-test-ui: ${{ steps.metadata.outputs.compute-test-ui }}
      go-tags: ${{ steps.metadata.outputs.go-tags }}
      # Space-separated Go module directories to test; empty means every module in go.work.
      # Changes confined to tools/pipeline only need that module's tests because no other module
      # depends on it. go_modules ignores tools/pipeline and covers go.work and tools.sh (which pins
      # gotestsum), so any of those tests everything.
      go-test-modules: >-
        ${{
          (
            contains(fromJSON(steps.changed-files.outputs.changed-files).groups, 'pipeline') &&
            !contains(fromJSON(steps.changed-files.outputs.changed-files).groups, 'go_app') &&
            !contains(fromJSON(steps.changed-files.outputs.changed-files).groups, 'go_modules') &&
            !contains(fromJSON(steps.changed-files.outputs.changed-files).groups, 'go_tests') &&
            !contains(fromJSON(steps.changed-files.outputs.changed-files).groups, 'go_toolchain') &&
            !contains(fromJSON(steps.changed-files.outputs.changed-files).groups, 'test_ci')
          ) && 'tools/pipeline' || ''
        }}
      is-draft: ${{ steps.metadata.outputs.is-draft }}
      is-ent-branch: ${{ steps.metadata.outputs.is-ent-branch }}
      is-ent-repo: ${{ steps.metadata.outputs.is-ent-repo }}
      is-fork: ${{ steps.metadata.outputs.is-fork }}
      labels: ${{ steps.metadata.outputs.labels }}
      workflow-trigger: ${{ steps.metadata.outputs.workflow-trigger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Make sure we check out correct ref based on PR labels and such
      - uses: ./.github/actions/checkout
        id: checkout
      - uses: ./.github/actions/metadata
        id: metadata
      # Get the elevated github token
      - if: steps.metadata.outputs.is-ent-repo == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: steps.metadata.outputs.is-ent-repo == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      # Determine the changed files
      - uses: ./.github/actions/changed-files
        id: changed-files
        with:
          github-token: ${{ steps.metadata.outputs.is-ent-repo != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
      - name: Ensure Go modules are cached
        uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ steps.metadata.outputs.is-ent-repo != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
          cache: prime # Prime the cache for downstream jobs; don't restore to disk
      # Make sure all required vault tools are cached at this point. We don't want all of the Go
      # tests and build jobs to build the tools and race to upload them to the cache.
      - uses: ./.github/actions/install-tools
        name: Ensure Vault tools are cached
        with:
          cache: prime # Prime the cache for downstream jobs; don't restore to disk

  test-autopilot-upgrade:
    name: Run Autopilot upgrade tool
    # Run the Autopilot upgrade tests if:
    # - The Autopilot code has changed.
    # - We're in the context of the vault enterprise repository and enterprise branch.
    # - The workflow was triggered by a push to main or a PR targeting main.
    #
    # The reason for the main branch restriction, is that the logic for automatically determining the source versions
    # to test depends on the .release/versions.hcl file, which might not be up-to-date nor exist outside of main.
    # If you'd like to run the autopilot tests for a specific git checkout or set of source versions,
    # you can manually trigger the workflow, see the .github/workflows/run-apupgrade-tests-ent.yml file in the ENT repo.
    if: |
      needs.setup.outputs.is-ent-branch == 'true' &&
      (github.base_ref == 'main' || github.ref == 'refs/heads/main') &&
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_autopilot')
    needs: setup
    permissions:
      id-token: write
      contents: read
    runs-on: ${{ fromJSON(needs.setup.outputs.compute-small) }}
    steps:
      - name: Check out the .release/versions.hcl file from Vault Enterprise repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.checkout-ref }}
          sparse-checkout: |
            .release/versions.hcl
            .github
      - name: Get Vault versions to test
        id: get-versions
        env:
          GH_TOKEN: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
        run: |
          # Change to the Vault Enterprise repository directory or exit if it fails
          cd "${GITHUB_WORKSPACE}" || exit 1

          # Extract active major versions from the versions.hcl file, which is used for managing active release branches
          active_major_versions=$(grep -Eo 'version\s+"[0-9]+\.[0-9]+\.x"' .release/versions.hcl | sed -E 's/version\s+"([0-9]+\.[0-9]+)\.x"/\1/')
          active_major_versions=$(sort <<< "${active_major_versions}")

          # List releases from the GitHub repository, process them with sed, and sort them in reverse order
          releases=$(gh -R hashicorp/vault-enterprise release list --exclude-drafts --exclude-pre-releases --json=name --jq '.[].name' | \
            sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+(\-rc[0-9]+)?)\+ent$/\1/' | \
            sort -r)

          # Initialize a variable to collect matched versions
          matched_versions=""

          # Read each version from the active major versions and match it against the newest release available
          while IFS= read -r version; do
            match=$(grep -m 1 "^${version}" <<< "${releases}" || true)
            if [ -n "${match}" ]; then
              if [ -n "${matched_versions}" ]; then
                matched_versions+=","
              fi
              # Append the matched version to the variable, adding the +ent suffix, which is used for Vault Enterprise releases
              matched_versions+="${match}+ent"
            fi
          done <<< "${active_major_versions}"

          # Export the matched versions as a comma-separated string to an environment variable
          echo "VAULT_SOURCE_VERSIONS=${matched_versions}" >> "${GITHUB_ENV}"
      - name: Run Autopilot upgrade tests
        uses: ./.github/actions/run-apupgrade-tests
        env:
          GOPATH: /home/runner/go
          GOPRIVATE: github.com/hashicorp/*
        with:
          checkout-ref: ${{ needs.setup.outputs.checkout-ref }}
          github-token: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
          source-versions: ${{ env.VAULT_SOURCE_VERSIONS }}

  test-go:
    # Run Go tests if the vault app changed
    if: |
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_modules') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_toolchain') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'pipeline') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_ci')
    name: Run Go tests
    needs: setup
    uses: ./.github/workflows/test-go.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: write
    with:
      # The regular Go tests use an extra runner to execute the binary-dependent tests. We isolate
      # them there so that the other tests aren't slowed down waiting for a binary build.
      binary-tests: true
      changed-files: ${{ needs.setup.outputs.changed-files }}
      checkout-ref: ${{ needs.setup.outputs.checkout-ref }}
      go-arch: amd64
      go-tags: '${{ needs.setup.outputs.go-tags }},deadlock'
      modules: ${{ needs.setup.outputs.go-test-modules }}
      name: standard
      runs-on: ${{ needs.setup.outputs.compute-test-go }}
      runs-on-small: ${{ needs.setup.outputs.compute-small }}
      test-timing-cache-key: go-test-timing-standard-${{ needs.setup.outputs.is-ent-branch && 'ent' || 'ce' }}
      # Test runners cannot be less than 2.
      total-runners: ${{ needs.setup.outputs.go-test-modules == '' && '16' || '2' }}
    secrets: inherit

  test-go-testonly:
    # Run Go tests tagged with "testonly" if the vault app changed
    if: |
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_modules') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_toolchain') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_ci')
    name: Run Go tests tagged with testonly
    needs: setup
    uses: ./.github/workflows/test-go.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: write
    with:
      changed-files: ${{ needs.setup.outputs.changed-files }}
      checkout-ref: ${{ needs.setup.outputs.checkout-ref }}
      go-arch: amd64
      go-tags: '${{ needs.setup.outputs.go-tags }},deadlock,testonly'
      name: testonly
      runs-on: ${{ needs.setup.outputs.compute-test-go }}
      runs-on-small: ${{ needs.setup.outputs.compute-small }}
      testonly: true
      test-timing-cache-restore: false
      test-timing-cache-save: false
      total-runners: 2 # test runners cannot be less than 2
    secrets: inherit

  test-go-race:
    # Run Go test with the data race detector enabled if the vault app changed and we're out of
    # drafts mode.
    if: |
      needs.setup.outputs.is-draft == 'false' &&
      (
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_modules') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_toolchain') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'pipeline') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_ci')
      )
    name: Run Go tests with data race detection
    needs: setup
    uses: ./.github/workflows/test-go.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: write
    with:
      changed-files: ${{ needs.setup.outputs.changed-files }}
      checkout-ref: ${{ needs.setup.outputs.checkout-ref }}
      env-vars: |
        {
          "VAULT_CI_GO_TEST_RACE": 1
        }
      extra-flags: '-race'
      name: race
      go-arch: amd64
      go-tags: ${{ needs.setup.outputs.go-tags }}
      modules: ${{ needs.setup.outputs.go-test-modules }}
      runs-on: ${{ needs.setup.outputs.compute-test-go }}
      runs-on-small: ${{ needs.setup.outputs.compute-small }}
      test-timing-cache-key: go-test-timing-race-${{ needs.setup.outputs.is-ent-branch && 'ent' || 'ce' }}
      # Test runners cannot be less than 2.
      total-runners: ${{ needs.setup.outputs.go-test-modules == '' && '16' || '2' }}
    secrets: inherit

  test-go-fips:
    name: Run Go tests with FIPS configuration
    # Run the Go tests with fips if the vault app changed, we're in the context vault enterprise
    # and our trigger is a merge to main or releases/* or if the 'fips' label is present on a PR.
    if: |
      (
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_modules') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_toolchain') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'pipeline') ||
        contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_ci')
      ) &&
      needs.setup.outputs.is-ent-branch == 'true' &&
      (
        needs.setup.outputs.workflow-trigger == 'push' || contains(needs.setup.outputs.labels, 'fips')
      )
    needs: setup
    uses: ./.github/workflows/test-go.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: write
    with:
      changed-files: ${{ needs.setup.outputs.changed-files }}
      checkout-ref: ${{ needs.setup.outputs.checkout-ref }}
      env-vars: |
        {
          "GOEXPERIMENT": "boringcrypto"
        }
      name: fips
      go-arch: amd64
      go-tags: '${{ needs.setup.outputs.go-tags }},deadlock,cgo,fips,fips_140_3'
      modules: ${{ needs.setup.outputs.go-test-modules }}
      runs-on: ${{ needs.setup.outputs.compute-test-go }}
      runs-on-small: ${{ needs.setup.outputs.compute-small }}
      test-timing-cache-key: go-test-timing-fips
      # Test runners cannot be less than 2.
      total-runners: ${{ needs.setup.outputs.go-test-modules == '' && '16' || '2' }}
    secrets: inherit

  test-ui:
    name: Test UI
    needs: setup
    if: |
      contains(needs.setup.outputs.labels, 'ui') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_ui') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_ci') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'ui')
    uses: ./.github/workflows/test-ui.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: write
    with:
      checkout-ref: ${{ needs.setup.outputs.checkout-ref }}
      runs-on: ${{ needs.setup.outputs.compute-build }}
      runs-on-small: ${{ needs.setup.outputs.compute-test-ui }}
      is-ent-repo: ${{ needs.setup.outputs.is-ent-repo }}
      is-ent-branch: ${{ needs.setup.outputs.is-ent-branch }}
    secrets: inherit

  check-go:
    name: Check Go modules and generated code
    # Make sure that our Go modules, workspaces, and generated code are correct.
    # We target this whenever something changes anything related to Go, rather
    # than just on mod/workspace changes, because code changes can break these
    # too: removing an import can leave a module untidy, and changing an enum
    # can leave its generated code stale.
    #
    # The pipeline tool doesn't know about Vault, so each step catches its
    # failure and explains how to fix it in Vault.
    if: |
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_app') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_modules') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_tests') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_toolchain') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'pipeline') ||
      contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_ci')
    needs: setup
    runs-on: ${{ fromJSON(needs.setup.outputs.compute-build) }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GOPRIVATE: github.com/hashicorp/*
      # Directory globs of the modules that other projects import. Go ignores replace directives
      # outside the main module, so these must build against the released versions of the workspace
      # modules they require rather than replacing them with the code on the branch.
      PUBLISHED_GO_MODULES: api api/auth/* sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.checkout-ref }}
      - if: needs.setup.outputs.is-ent-repo == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: needs.setup.outputs.is-ent-repo == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          # Don't export the token to every later step's environment, so go generate doesn't get it.
          # This limits its exposure rather than isolating it: the setup actions below still use it,
          # and on a cache miss they run Makefile targets from the pull request.
          exportEnv: false
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      - uses: ./.github/actions/set-up-pipeline
        with:
          github-token: ${{ needs.setup.outputs.is-ent-repo != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
      - uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ needs.setup.outputs.is-ent-repo != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
          cache: fetch-only
      - id: install-tools
        uses: ./.github/actions/install-tools # pinned enumer
        with:
          cache: fetch-only
      - name: Check go.work and replace directives
        # Only module files can break this check. The pipeline group stands in for tools/pipeline's
        # go.mod, which go_modules ignores. test_ci keeps it exercised when the job changes.
        if: |
          !cancelled() && steps.install-tools.outcome == 'success' &&
          (
            contains(fromJSON(needs.setup.outputs.changed-files).groups, 'go_modules') ||
            contains(fromJSON(needs.setup.outputs.changed-files).groups, 'pipeline') ||
            contains(fromJSON(needs.setup.outputs.changed-files).groups, 'test_ci')
          )
        run: |
          set -euo pipefail
          # read doesn't expand globs, so the patterns reach the pipeline tool as written.
          read -r -a published <<< "$PUBLISHED_GO_MODULES"
          published_flags=()
          for pattern in "${published[@]}"; do
            published_flags+=(--published "$pattern")
          done
          if pipeline go check workspace ${{ runner.debug && '--log debug' || '' }} \
            "${published_flags[@]}" --format markdown | tee -a "$GITHUB_STEP_SUMMARY"; then
            exit 0
          fi

          # The fix depends on each problem, so list them in the annotation too. Rerunning is cheap:
          # the check only reads go.work and go.mod files.
          problems=$(pipeline go check workspace "${published_flags[@]}" --format json 2> /dev/null |
            jq -r '.violations[]? | "- \(.module): \(.detail)"' || true)
          what_to_do=$(cat <<'EOF'
          Fix each problem by its kind:

          - "is committed but go.work has no 'use ...'": add the module to the workspace with `go work use ./<dir>`, or delete the stray go.mod.
          - "requires ... without a replace" or "replace ... resolves to ...": modules that aren't published must build against this branch's code of the workspace modules they require. Add the replace that the problem names to the module's go.mod, then run `make go-mod-tidy`.
          - "published module replaces ...": other projects import the published modules (PUBLISHED_GO_MODULES in .github/workflows/ci.yml) and Go ignores their replace directives, so they must build against released versions. Run `go mod edit -dropreplace=<module>` in the published module's directory, then `make go-mod-tidy`. If it needs a change that isn't released yet, release the module it requires first, then require that version with `GOWORK=off go get <module>@<version>`.

          If no problems are listed, the check couldn't run. The step's log has the error.
          EOF
          )
          printf '\n### What to do\n\n%s\n' "$what_to_do" >> "$GITHUB_STEP_SUMMARY"
          annotation=$(printf 'Problems:\n%s\n\nWhat to do:\n%s' "${problems:-(none listed)}" "$what_to_do")
          annotation=${annotation//'%'/'%25'}
          echo "::error title=go.work or a go.mod file is wrong::${annotation//$'\n'/%0A}"
          exit 1
      - name: Check that every Go module is tidy
        if: ${{ !cancelled() && steps.install-tools.outcome == 'success' }}
        env:
          # Credentials only for this step: tidy may fetch go.mod files the cache lacks.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://user:${{ needs.setup.outputs.is-ent-repo != 'true' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}@github.com.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com
        run: |
          set -euo pipefail
          if pipeline go check tidy ${{ runner.debug && '--log debug' || '' }} --format markdown |
            tee -a "$GITHUB_STEP_SUMMARY"; then
            exit 0
          fi

          what_to_do=$(cat <<'EOF'
          Run `make go-mod-tidy` and commit the go.mod and go.sum changes. The step's log and the job summary show the change each module needs.

          A module with an "error" result couldn't be tidied at all. Run `GOWORK=off go mod tidy` in its directory to see why. Usually it requires a version, or imports a package, that doesn't exist.

          If no table was printed, the check couldn't run. The step's log has the error.
          EOF
          )
          printf '\n### What to do\n\n%s\n' "$what_to_do" >> "$GITHUB_STEP_SUMMARY"
          what_to_do=${what_to_do//'%'/'%25'}
          echo "::error title=Go modules aren't tidy::${what_to_do//$'\n'/%0A}"
          exit 1
      - name: Check that published Go modules build with this branch
        # Published modules are tested against the released versions of the workspace modules they
        # require, which is what their importers get. Build them, and compile their tests, against
        # this branch's code too, so a change there can't break their next release unnoticed.
        if: ${{ !cancelled() && steps.install-tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          read -r -a published <<< "$PUBLISHED_GO_MODULES"
          # Match a module directory like path.Match does: the glob must match and '*' can't cross
          # a '/', so the directory has as many '/' as the pattern.
          is_published() {
            local pattern
            for pattern in "${published[@]}"; do
              # shellcheck disable=SC2053 # pattern is a glob
              if [[ "$1" == $pattern ]] && [ "${1//[^\/]/}" = "${pattern//[^\/]/}" ]; then
                return 0
              fi
            done
            return 1
          }

          failed=()
          while IFS= read -r dir; do
            if ! is_published "$dir"; then
              continue
            fi
            echo "::group::$dir"
            # The go.work in the repository root is in effect, so required workspace modules
            # resolve to their directories. -exec /usr/bin/true compiles test binaries without
            # running them. There are no build tags, as for the modules' importers.
            if ! (cd "$dir" && go build ./... && go test -vet=off -run '^$' -exec /usr/bin/true ./...); then
              failed+=("$dir")
            fi
            echo "::endgroup::"
          done < <(pipeline go list modules --format json | jq -r '.modules[].dir')

          if [ "${#failed[@]}" -eq 0 ]; then
            exit 0
          fi

          problem="These published modules don't build, or their tests don't compile, against this branch's code of the workspace modules they require: ${failed[*]}. The compiler errors are in the step's log."
          what_to_do=$(cat <<'EOF'
          Their own tests use the released versions of the modules they require, so those still pass, but their next release would be broken. Usually a change to api removed or changed something that sdk or an api/auth/* module uses.

          Keep the change backward compatible, or update the published module so it builds with it. To reproduce, run `go build ./... && go test -vet=off -run '^$' -exec /usr/bin/true ./...` in the module's directory with the repository's go.work in place.
          EOF
          )
          printf '# Published Go module build\n\n%s\n\n### What to do\n\n%s\n' "$problem" "$what_to_do" >> "$GITHUB_STEP_SUMMARY"
          annotation=$(printf '%s\n\nWhat to do:\n%s' "$problem" "$what_to_do")
          annotation=${annotation//'%'/'%25'}
          echo "::error title=Published Go modules don't build with this branch::${annotation//$'\n'/%0A}"
          exit 1
      - name: Check that the Go tests cover every module
        # The Go test jobs split the packages that 'pipeline go list packages' lists across runners,
        # then test each runner's packages from the module 'pipeline go group packages' puts them in.
        # Pull requests that only change tools/pipeline only test that module, so make sure here
        # that listing and grouping still cover every module.
        if: ${{ !cancelled() && steps.install-tools.outcome == 'success' }}
        env:
          GO_TAGS: ${{ needs.setup.outputs.go-tags }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/go-test-coverage"
          mkdir -p "$dir"
          pipeline go list modules --format json | jq '[.modules[].dir] | sort' > "$dir/modules.json"
          pipeline go list packages --format json --tags "$GO_TAGS" > "$dir/packages.json"
          jq -r '.modules[].packages[]' "$dir/packages.json" |
            pipeline go group packages --format json - > "$dir/grouped.json"
          normalize='[.modules[] | select(.packages | length > 0) | {dir, packages: (.packages | sort)}] | sort_by(.dir)'
          jq -S "$normalize" "$dir/packages.json" > "$dir/listed-normalized.json"
          jq -S "$normalize" "$dir/grouped.json" > "$dir/grouped-normalized.json"

          problems=()
          missing=$(jq -r --slurpfile listed "$dir/listed-normalized.json" \
            '. - [$listed[0][].dir] | join(" ")' "$dir/modules.json")
          if [ -n "$missing" ]; then
            problems+=("- No packages were listed for these go.work modules: $missing")
          fi
          if ! diff -u "$dir/listed-normalized.json" "$dir/grouped-normalized.json"; then
            problems+=("- Grouping the listed packages doesn't put each one back in its module. The step's log has the difference.")
          fi
          if [ "${#problems[@]}" -eq 0 ]; then
            echo "Listing and grouping cover all $(jq length "$dir/modules.json") modules."
            exit 0
          fi

          what_to_do=$(cat <<'EOF'
          The Go test jobs would silently skip tests. `pipeline go list packages` must list at least one package for every module in go.work, and `pipeline go group packages` must put each listed package back in the module it came from.

          - If this pull request changes tools/pipeline, fix `go list packages` or `go group packages` in tools/pipeline/internal/pkg/golang.
          - If it adds a module to go.work, make sure the module has at least one Go package.
          EOF
          )
          problem=$(printf '%s\n' "${problems[@]}")
          printf '# Go test coverage of modules\n\n%s\n\n### What to do\n\n%s\n' "$problem" "$what_to_do" >> "$GITHUB_STEP_SUMMARY"
          annotation=$(printf 'Problems:\n%s\n\nWhat to do:\n%s' "$problem" "$what_to_do")
          annotation=${annotation//'%'/'%25'}
          echo "::error title=The Go tests don't cover every module::${annotation//$'\n'/%0A}"
          exit 1
      - name: Check that generated code is up to date
        # No credentials in the environment: go generate runs commands written in the pull request.
        # No build tags yet: enumer can't emit build constraints, so enterprise-only packages
        # can't be regenerated reproducibly. When that's fixed, add
        # --tags '${{ needs.setup.outputs.go-tags }}'.
        # This runs last because it leaves regenerated files in the working tree.
        if: ${{ !cancelled() && steps.install-tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          if pipeline go check generate ${{ runner.debug && '--log debug' || '' }} --format markdown |
            tee -a "$GITHUB_STEP_SUMMARY"; then
            exit 0
          fi

          what_to_do=$(cat <<'EOF'
          Run `make tools tools-pipeline`, then `pipeline go check generate`, and commit the files it changes. The check runs `go generate ./...` in every module the same way CI does and leaves the regenerated files in your working tree. The step's log and the job summary list each change. By result:

          - "modified", "added" or "deleted": commit the change.
          - "added-ignored": a generator wrote a file that git ignores, so builds that skip generation never see it. Commit it, e.g. by un-ignoring it, or stop generating it.
          - "error": a go:generate directive failed in that module. The detail has its output.

          If no table was printed, the check couldn't run. The step's log has the error.
          EOF
          )
          printf '\n### What to do\n\n%s\n' "$what_to_do" >> "$GITHUB_STEP_SUMMARY"
          what_to_do=${what_to_do//'%'/'%25'}
          echo "::error title=Generated Go code is out of date::${what_to_do//$'\n'/%0A}"
          exit 1

  tests-completed:
    needs:
      - setup
      - check-go
      - test-autopilot-upgrade
      - test-go
      - test-go-testonly
      - test-go-race
      - test-go-fips
      - test-ui
    if: always()
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64"]') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Determine the overall status of our required test jobs.
      - name: Determine status
        id: status
        run: |
          # Determine the overall status of the job. We allow fips and race tests to fail so we
          # don't consider their result here.
          #
          # Encode the needs context into JSON, filter out unrequired workflows, shape the result
          # into a more useful schema. Determine the overall status by comparing the total number of
          # successful results with the number of required jobs.
          if results=$(jq -rec 'del(.["test-go-fips"], .["test-go-race"]) as $required
              | $required | keys as $jobs
              | reduce $jobs[] as $job ([]; . + [{job: $job}+$required[$job]])' <<< '${{ toJSON(needs) }}'
          ); then
            # Determine if all of our required jobs have succeeded.
            if jq -rec 'length as $expected
              | [.[] | select((.result == "success") or (.result == "skipped"))] | length as $got
              | $expected == $got' <<< "$results"; then
              msg="All required test jobs succeeded!"
              result="success"
            else
              msg="One or more required test jobs failed!"
              result="failed"
            fi
          else
            msg="Failed to decode and filter test results"
            result="failed"
            results="''"
          fi
          {
            echo "msg=${msg}"
            echo "result=${result}"
            echo "results<<EOFRESULTS"$'\n'"${results}"$'\n'EOFRESULTS
          } | tee -a "$GITHUB_OUTPUT"
      - if: needs.setup.outputs.is-ent-repo == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: needs.setup.outputs.is-ent-repo == 'true'
        id: secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/slack feed-vault-ci-official-webhook-url | slackbot-webhook-url;
      - id: slackbot-webhook-url
        run: echo "slackbot-webhook-url=${{ needs.setup.outputs.is-ent-repo != 'true' && secrets.FEED_VAULT_CI_OFFICIAL_WEBHOOK_URL || steps.secrets.outputs.slackbot-webhook-url }}" >> "$GITHUB_OUTPUT"
      - if: |
          always() &&
          needs.setup.outputs.workflow-trigger == 'push' &&
          (
            needs.setup.result == 'failure' ||
            needs.check-go.result == 'failure' ||
            needs.test-autopilot-upgrade.result == 'failure' ||
            needs.test-go.result == 'failure' ||
            needs.test-go-race.result == 'failure' ||
            needs.test-go-race.outputs.data-race-result == 'failure' ||
            needs.test-go-testonly.result == 'failure' ||
            needs.test-ui.result == 'failure'
          )
        name: Notify build failures in Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true # exit with an error if the payload is invalid
          retries: rapid # retry if we're being rated limited
          webhook: ${{ steps.slackbot-webhook-url.outputs.slackbot-webhook-url }}
          webhook-type: incoming-webhook
          payload: |
            text: ${{ needs.setup.outputs.is-ent-branch == 'true' && 'vault-enterprise' || 'vault' }} test failures on ${{ github.ref_name }}
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ':flashing-light: ${{ needs.setup.outputs.is-ent-branch == 'true' && 'vault-enterprise' || 'vault' }} test failures on ${{ github.ref_name }} :flashing-light:'
                  emoji: true
              - type: divider
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ${{ needs.setup.result                  == 'failure' && ':x: Setup'             || '' }}
                    ${{ needs.check-go.result               == 'failure' && ':x: Go module and generated code checks' || '' }}
                    ${{ needs.test-autopilot-upgrade.result == 'failure' && ':x: Autopilot upgrade' || '' }}
                    ${{ needs.test-go.result                == 'failure' && ':x: Go tests'          || '' }}
                    ${{ needs.test-go-testonly.result       == 'failure' && ':x: Go testonly tests' || '' }}
                    ${{ needs.test-go-fips.result           == 'failure' && ':x: Go FIPS tests'     || '' }}
                    ${{ needs.test-ui.result                == 'failure' && ':x: UI tests'          || '' }}
                    ${{ needs.test-go-race.result != 'skipped' &&
                      (
                        ((needs.test-go-race.outputs.data-race-result != '' && needs.test-go-race.outputs.data-race-result != 'success') && ':x: Go race tests (Data race(s) detected)') ||
                        (needs.test-go-race.result == 'failure' && ':x: Go race tests' || '')
                      ) || ''
                    }}
                accessory:
                  type: button
                  text:
                    type: plain_text
                    text: View Failing Workflow
                    emoji: true
                  url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Only create the PR summary if it's a pull request and it is not a fork as we need access
      # to secrets.
      - if: ${{ needs.setup.outputs.is-fork == 'false' }}
        id: download-summaries
        name: Download failure summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: failure-summary-*.md
          path: failure-summaries
          merge-multiple: true
        # Don't allow failure summary aggregation to fail this workflow
        continue-on-error: true
      - if: needs.setup.outputs.is-fork == 'false' && steps.download-summaries.outcome == 'success'
        id: prepare-failure-summary
        name: Prepare failure summary
        run: |
          # Sort all of the summary table rows and push them to a temp file.
          temp_file_name=temp-$(date +%s)
          cat failure-summaries/*.md | sort >> "$temp_file_name"

          # If there are test failures, present them in a format of a GitHub Markdown table.
          if [ -s "$temp_file_name" ]; then
            # Here we create the headings for the summary table
            {
              echo "| Test Type | Package | Test | Elapsed | Runner Index | Logs |"
              echo "| --------- | ------- | ---- | ------- | ------------ | ---- |"
              cat "$temp_file_name"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [ "${{ steps.status.outputs.result }}" == 'success' ]; then
              echo "### All required Go tests passed! :white_check_mark:" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo 'table-test-results<<EOFTABLE'
            cat "$temp_file_name"
            echo EOFTABLE
          } | tee -a "$GITHUB_OUTPUT"
      - name: Create comment
        if: github.head_ref != '' && needs.setup.outputs.is-fork == 'false' && steps.prepare-failure-summary.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.event.repository.name }}
          RESULT: ${{ steps.status.outputs.result }}
          TABLE_DATA: ${{ steps.prepare-failure-summary.outputs.table-test-results }}
        run: ./.github/scripts/report-ci-status.sh
      - if: always() && steps.status.outputs.result != 'success'
        name: Check for failed status
        run: |
          echo "${{ steps.status.outputs.msg }}: ${{ steps.status.outputs.results }}"
          exit 1
