---
name: enos

on:
  # Only trigger this working using workflow_call. This workflow requires many
  # secrets that must be inherited from the caller workflow.
  workflow_call:
    inputs:
      # The name of the artifact that we're going to use for testing. This should
      # match exactly to build artifacts uploaded to Github and Artifactory.
      build-artifact-name:
        required: true
        type: string
      # The maximum number of scenarios to include in the test sample.
      sample-max:
        default: 1
        type: number
      # The name of the enos scenario sample that defines compatible scenarios we can
      # can test with.
      sample-name:
        required: true
        type: string
      runs-on:
        # NOTE: The value should be JSON encoded as that's the only way we can
        # pass arrays with workflow_call.
        type: string
        required: false
        default: '"ubuntu-latest"'
      ssh-key-name:
        type: string
        default: ${{ github.event.repository.name }}-ci-ssh-key
      vault-edition:
        required: false
        type: string
        default: ce
      # The Git commit SHA used as the revision when building vault
      vault-revision:
        required: true
        type: string
      vault-version:
        required: true
        type: string

jobs:
  metadata:
    runs-on: ${{ github.repository == 'hashicorp/vault' && 'ubuntu-latest' || fromJSON('["self-hosted","ubuntu-22.04-x64", "large"]') }}
    permissions:
      id-token: write # vault-auth
      contents: read
      pull-requests: read
    outputs:
      build-date: ${{ steps.metadata.outputs.build-date }}
      is-ent-repo: ${{ steps.metadata.outputs.is-ent-repo }}
      sample: ${{ steps.metadata.outputs.sample }}
      vault-version: ${{ steps.metadata.outputs.vault-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.vault-revision }}
      - if: inputs.vault-edition != 'ce'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: inputs.vault-edition != 'ce'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;
      - uses: ./.github/actions/changed-files
        id: changed-files
        with:
          github-token: ${{ github.repository == 'hashicorp/vault' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
      - uses: hashicorp/action-setup-enos@3817610f3f8dc74a8dbe15bc23c6dc3164f9b224 # v1.53
        with:
          github-token: ${{ github.repository == 'hashicorp/vault' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
      - uses: ./.github/actions/create-dynamic-config
        with:
          github-token: ${{ github.repository == 'hashicorp/vault' && secrets.ELEVATED_GITHUB_TOKEN || steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}
          vault-version: ${{ inputs.vault-version }}
          vault-edition: ${{ inputs.vault-edition }}
      - id: metadata
        run: |
          build_date=$(make ci-get-date)
          sample_seed=$(date +%s)
          if ! sample=$(enos scenario sample observe "${{ inputs.sample-name }}" --chdir ./enos --min 1 --max "${{ inputs.sample-max }}" --seed "${sample_seed}" --format json | jq -c ".observation.elements"); then
            echo "failed to do sample observation: $sample" 2>&1
            exit 1
          fi

          # Auto-detect changed enos scenario files and ensure those scenarios
          # are always included in the run. Parses the changed-files input for
          # any enos/enos-scenario-*.hcl paths, extracts the scenario name
          # (e.g. enos/enos-scenario-plugin.hcl -> plugin), then runs a targeted
          # sample observe --include <name> for each — identical to the random
          # sample mechanism, so enos picks a valid variant automatically.
          changed_files='${{ steps.changed-files.outputs.changed-files }}'
          changed_scenario_names=$(echo "${changed_files}" \
            | jq -r '.files[]
                | select(test("enos/enos-scenario-[^/]+\\.hcl$"))
                | gsub("enos/enos-scenario-(?P<n>[^/]+)\\.hcl$"; "\(.n)")' \
            | sort -u)

          if [[ -n "${changed_scenario_names}" ]]; then
            echo "Detected changed enos scenario files — adding targeted observations:"
            while IFS= read -r scenario_name; do
              echo "  + ${scenario_name}"
              if targeted=$(enos scenario sample observe "${{ inputs.sample-name }}" \
                  --chdir ./enos \
                  --include "${scenario_name}" \
                  --min 1 --max 1 \
                  --seed "${sample_seed}" \
                  --format json | jq -c ".observation.elements"); then
                sample=$(echo "${sample} ${targeted}" | jq -sc 'add | unique_by(.scenario.id.filter)')
              else
                echo "warning: failed to observe changed scenario '${scenario_name}' (may not be in this sample): ${targeted}" 2>&1
              fi
            done <<< "${changed_scenario_names}"
          fi

          if [[ "${{ inputs.vault-edition }}" == "ce" ]]; then
            vault_version="${{ inputs.vault-version }}"
          else
            # shellcheck disable=2001
            vault_version="$(sed 's/+ent/+${{ inputs.vault-edition }}/g' <<< '${{ inputs.vault-version }}')"
          fi
          {
            echo "build-date=${build_date}"
            echo 'is-ent-repo=${{ github.repository == 'hashicorp/vault-enterprise' }}'
            echo "sample=${sample}"
            echo "sample-seed=${sample_seed}" # This isn't used outside of here but is nice to know for duplicating observations
            echo "vault-version=${vault_version}"
          } | tee -a "$GITHUB_OUTPUT"

  # Run the Enos test scenario(s)
  run:
    needs: metadata
    name: run ${{ matrix.scenario.id.filter }}
    strategy:
      fail-fast: false # don't fail as that can skip required cleanup steps for jobs
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.sample) }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      id-token: write # vault-auth
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.vault-revision }}
      - if: needs.metadata.outputs.is-ent-repo == 'true'
        id: vault-auth
        name: Vault Authenticate
        run: vault-auth
      - if: needs.metadata.outputs.is-ent-repo == 'true'
        id: vault-secrets
        name: Fetch Vault Secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/artifactory bearer-token | ARTIFACTORY_BEARER_TOKEN;
            kv/data/github/${{ github.repository }}/aws access-key-id_09042025 | AWS_ACCESS_KEY_ID_CI_09042025;
            kv/data/github/${{ github.repository }}/aws secret-access-key_09042025 | AWS_SECRET_ACCESS_KEY_CI_09042025;
            kv/data/github/${{ github.repository }}/aws role-arn | AWS_ROLE_ARN_CI;
            kv/data/github/${{ github.repository }}/consul license | CONSUL_LICENSE;
            kv/data/github/${{ github.repository }}/vault-radar license | RADAR_LICENSE;
            kv/data/github/${{ github.repository }}/slack feed-vault-enos-failures-webhook-url | SLACK_WEBHOOK_URL;
            kv/data/github/${{ github.repository }}/enos ssh-key | SSH_KEY_PRIVATE_CI;
            kv/data/github/${{ github.repository }}/license license_1 | VAULT_LICENSE;
            kv/data/github/${{ github.repository }}/ibm-license license_1 | VAULT_LICENSE_IBM;
            kv/data/github/${{ github.repository }}/github-token token | ELEVATED_GITHUB_TOKEN;

      - id: secrets
        run: |
          if [[ "${{ needs.metadata.outputs.is-ent-repo }}" != 'true' ]]; then
            {
              echo 'artifactory-token=${{ secrets.ARTIFACTORY_BEARER_TOKEN }}'
              echo 'aws-access-key-id=${{ secrets.AWS_ACCESS_KEY_ID_CI_09042025 }}'
              echo 'aws-secret-access-key=${{ secrets.AWS_SECRET_ACCESS_KEY_CI_09042025 }}'
              echo 'aws-role-arn=${{ secrets.AWS_ROLE_ARN_CI }}'
              echo 'consul-license=${{ secrets.CONSUL_LICENSE }}'
              echo 'github-token=${{ secrets.ELEVATED_GITHUB_TOKEN }}'
              echo 'radar-license=${{ secrets.RADAR_LICENSE }}'
              echo 'slack-webhook-url=${{ secrets.FEED_VAULT_ENOS_FAILURES_WEBHOOK_URL }}'
              echo 'ssh-key<<EOFSSHKEYCE'
              echo "${{ secrets.SSH_KEY_PRIVATE_CI }}"
              echo EOFSSHKEYCE
              echo 'vault-license=${{ secrets.VAULT_LICENSE }}'
              echo 'vault-license-ibm=${{ secrets.VAULT_LICENSE_IBM }}'
           } | tee -a "$GITHUB_OUTPUT"
          else
            {
              echo 'artifactory-token=${{ steps.vault-secrets.outputs.ARTIFACTORY_BEARER_TOKEN }}'
              echo 'aws-access-key-id=${{ steps.vault-secrets.outputs.AWS_ACCESS_KEY_ID_CI_09042025 }}'
              echo 'aws-secret-access-key=${{ steps.vault-secrets.outputs.AWS_SECRET_ACCESS_KEY_CI_09042025 }}'
              echo 'aws-role-arn=${{ steps.vault-secrets.outputs.AWS_ROLE_ARN_CI }}'
              echo 'consul-license=${{ steps.vault-secrets.outputs.CONSUL_LICENSE }}'
              echo 'github-token=${{ steps.vault-secrets.outputs.ELEVATED_GITHUB_TOKEN }}'
              echo 'radar-license=${{ steps.vault-secrets.outputs.RADAR_LICENSE }}'
              echo 'slack-webhook-url=${{ steps.vault-secrets.outputs.SLACK_WEBHOOK_URL }}'
              echo 'ssh-key<<EOFSSHKEYENT'
              echo "${{ steps.vault-secrets.outputs.SSH_KEY_PRIVATE_CI }}"
              echo EOFSSHKEYENT
              echo 'vault-license=${{ steps.vault-secrets.outputs.VAULT_LICENSE }}'
              echo 'vault-license-ibm=${{ steps.vault-secrets.outputs.VAULT_LICENSE_IBM }}'
            } | tee -a "$GITHUB_OUTPUT"
          fi

      - id: env
        run: |
          # Configure input environment variables.
          {
            echo 'GITHUB_TOKEN=${{ steps.secrets.outputs.github-token }}'
            echo 'ENOS_DEBUG_DATA_ROOT_DIR=/tmp/enos-debug-data'
            echo 'ENOS_VAR_artifactory_token=${{ steps.secrets.outputs.artifactory-token }}'
            echo 'ENOS_VAR_aws_region=${{ matrix.attributes.aws_region }}'
            echo 'ENOS_VAR_aws_ssh_keypair_name=${{ inputs.ssh-key-name }}'
            echo 'ENOS_VAR_aws_ssh_private_key_path=./support/private_key.pem'
            echo 'ENOS_VAR_consul_license_path=./support/consul.hclic'
            echo 'ENOS_VAR_distro_version_amzn=${{ matrix.attributes.distro_version_amzn }}'
            echo 'ENOS_VAR_distro_version_rhel=${{ matrix.attributes.distro_version_rhel }}'
            echo 'ENOS_VAR_distro_version_sles=${{ matrix.attributes.distro_version_sles }}'
            echo 'ENOS_VAR_distro_version_ubuntu=${{ matrix.attributes.distro_version_ubuntu }}'
            echo 'ENOS_VAR_terraform_plugin_cache_dir=./support/terraform-plugin-cache'
            echo 'ENOS_VAR_vault_artifact_path=./support/downloads/${{ inputs.build-artifact-name }}'
            echo 'ENOS_VAR_vault_build_date=${{ needs.metadata.outputs.build-date }}'
            echo 'ENOS_VAR_vault_license_path=./support/vault.hclic'
            echo 'ENOS_VAR_vault_ibm_license_path=./support/ibm-pao.lic'
            echo 'ENOS_VAR_vault_product_version=${{ needs.metadata.outputs.vault-version }}'
            echo 'ENOS_VAR_vault_radar_license_path=./support/vault-radar.hclic'
            echo 'ENOS_VAR_vault_revision=${{ inputs.vault-revision }}'
            echo 'ENOS_VAR_vault_upgrade_initial_version=${{ matrix.attributes.upgrade_initial_version }}'
            echo 'ENOS_VAR_verify_aws_secrets_engine=false'
            echo 'ENOS_VAR_verify_kmip_secrets_engine=true'
            echo 'ENOS_VAR_verify_ldap_secrets_engine=false'
            echo 'ENOS_VAR_verify_log_secrets=true'
          } | tee -a "$GITHUB_ENV"

      - uses: ./.github/actions/set-up-go
        with:
          github-token: ${{ steps.secrets.outputs.github-token }}
          no-save: true
          no-restore: true

      - name: Install LDAP client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ldap-utils

      - uses: ./.github/actions/install-tools

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ steps.secrets.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.secrets.outputs.aws-secret-access-key }}
          aws-region: ${{ matrix.attributes.aws_region }}
          role-to-assume: ${{ steps.secrets.outputs.aws-role-arn }}
          role-skip-session-tagging: true
          role-duration-seconds: 3600

      - uses: ./.github/actions/create-dynamic-config
        with:
          github-token: ${{ steps.secrets.outputs.github-token }}
          vault-version: ${{ inputs.vault-version }}
          vault-edition: ${{ inputs.vault-edition }}

      - name: Prepare scenario dependencies
        id: prepare_scenario
        run: |
          mkdir -p "./enos/support/terraform-plugin-cache"
          echo "${{ steps.secrets.outputs.ssh-key }}" > "./enos/support/private_key.pem"
          chmod 600 "./enos/support/private_key.pem"
          sha256sum "./enos/support/private_key.pem"
          du -h "./enos/support/private_key.pem"
          scenario_safe_name=$(echo "${{ matrix.scenario.id.filter }}" | sed -e 's/ /_/g' | sed -e 's/:/=/g')
          # Artifact names are truncated to ensure prefix + variable + suffix ≤ 235 chars (GitHub limit: 255, minus compression suffix buffer)
          {
            echo "debug_data_artifact_name=enos-debug-data_${scenario_safe_name:0:219}"
            echo "test_results_artifact_name=test-results_${scenario_safe_name:0:222}"
            echo "junit_results_artifact_name=junit-results_${scenario_safe_name:0:221}"
            echo "failure_summary_artifact_name=failure-summary-enos_${scenario_safe_name:0:211}.md"
            echo "aws_resources_artifact_name=aws-resources_${scenario_safe_name:0:221}"
          } | tee -a "$GITHUB_OUTPUT"

      - if: contains(inputs.sample-name, 'build')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build-artifact-name }}
          path: ./enos/support/downloads

      - if: contains(inputs.sample-name, 'ent')
        name: Configure Vault licenses
        run: |
          echo "${{ steps.secrets.outputs.vault-license }}" > ./enos/support/vault.hclic || true
          echo "${{ steps.secrets.outputs.vault-license-ibm }}" > ./enos/support/ibm-pao.lic || true

      - if: contains(matrix.scenario.id.filter, 'consul_edition:ent')
        name: Configure Consul license
        run: |
          echo "${{ steps.secrets.outputs.consul-license }}" > ./enos/support/consul.hclic || true

      - name: Configure Vault Radar license
        run: |
          echo "${{ steps.secrets.outputs.radar-license }}" > ./enos/support/vault-radar.hclic || true

      # As many scenarios run in parallel and many PRs run in parallel, absolute
      # delta counting between resources is hard to glean a useful signal from.
      # Therefore, we only capture AWS resources when debugging to avoid the
      # 1-1.5 minute penalty that it often imposes.
      - name: Capture AWS Resource Counts Before Test
        id: capture-aws-before
        if: runner.debug == '1'
        continue-on-error: true
        run: |
          chmod +x ./.github/scripts/capture-aws-resources.sh
          ./.github/scripts/capture-aws-resources.sh \
            "${{ matrix.attributes.aws_region }}" \
            "${{ matrix.scenario.id.filter }}" \
            "enos-aws-resource-before.txt" \
            "Before Enos Test"

      - id: run-scenario
        name: Run Enos scenario ${{ matrix.scenario.id.filter }}
        uses: ./.github/actions/run-enos-scenario
        with:
          scenario-filter: ${{ matrix.scenario.id.filter }}
          working-directory: ./enos
          timeout: 45m0s
          retry-timeout: 30m0s
          destroy-timeout: 10m0s
          show-state-on-retry: ${{ github.repository == 'hashicorp/vault-enterprise' && 'true' || 'false' }}
          upload-debug-data: 'true'
          debug-data-retention-days: '30'
          debug-data-path: ${{ env.ENOS_DEBUG_DATA_ROOT_DIR }}

      - name: Capture AWS Resource Counts After Test
        id: capture-aws-after
        if: always() && runner.debug == '1'
        continue-on-error: true
        run: |
          chmod +x ./.github/scripts/capture-aws-resources.sh
          ./.github/scripts/capture-aws-resources.sh \
            "${{ matrix.attributes.aws_region }}" \
            "${{ matrix.scenario.id.filter }}" \
            "enos-aws-resource-after.txt" \
            "After Enos Test"

      - name: Show AWS Resource Differences
        id: show-resource-diff
        if: always() && runner.debug == '1'
        continue-on-error: true
        run: |
          echo "=== AWS Resource Count Differences ==="
          echo ""
          if [[ -f "enos-aws-resource-before.txt" && -f "enos-aws-resource-after.txt" ]]; then
            echo "Comparing before and after resource counts..."
            echo ""
            diff -u enos-aws-resource-before.txt enos-aws-resource-after.txt || true
          else
            echo "Could not find both before and after files for comparison"
          fi

      - name: Upload AWS Resource Snapshots
        if: always() && runner.debug == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare_scenario.outputs.aws_resources_artifact_name }}
          path: |
            enos-aws-resource-before.txt
            enos-aws-resource-after.txt
          retention-days: 30
          if-no-files-found: ignore
        continue-on-error: true

      - name: Prepare Test Results and Failure Summaries
        if: always()
        id: prepare_test_summary
        continue-on-error: true
        run: |
          if ! find /tmp -maxdepth 1 -name 'vault_test_results_*.json' -type f -print -quit 2>/dev/null | grep -q .; then
            echo "failure_summary_created=false" | tee -a "$GITHUB_OUTPUT"
            echo "::warning::No test results found in /tmp/vault_test_results_*.json"
            exit 0
          fi

          # Find the most recent JSON test results file
          json_file=$(find /tmp -maxdepth 1 -name 'vault_test_results_*.json' -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2-)

          if [ -n "$json_file" ] && [ -f "$json_file" ]; then
            # Create failure summary file for aggregation in build.yml
            failure_summary_file="${{ steps.prepare_scenario.outputs.failure_summary_artifact_name }}"

            # Extract failed tests and format as table rows matching ci.yml format
            # Format: | Test Type | Package | Test | Elapsed | Runner Index | Logs |
            jq -r 'select(.Action == "fail") | select(.Test != null) | "| enos | \(.Package) | \(.Test) | \(.Elapsed // "N/A") | ${{ matrix.scenario.id.filter }} | [view test results :scroll:](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"' \
              "$json_file" > "$failure_summary_file"

            # Count total tests, passes, and failures
            total_tests=$(jq -r 'select(.Action == "pass" or .Action == "fail") | select(.Test != null)' "$json_file" | jq -s 'length')
            passed_tests=$(jq -r 'select(.Action == "pass") | select(.Test != null)' "$json_file" | jq -s 'length')
            failed_tests=$(jq -r 'select(.Action == "fail") | select(.Test != null)' "$json_file" | jq -s 'length')

            # Output for use in tarball creation
            echo "failure_summary_created=true" | tee -a "$GITHUB_OUTPUT"

            # Create step summary for this specific scenario
            {
              echo "## Test Results for ${{ matrix.scenario.id.filter }}"
              echo ""
              echo "- **Total Tests:** $total_tests"
              echo "- **Passed:** ✅ $passed_tests"
              echo "- **Failed:** ❌ $failed_tests"
              echo ""

              # If there are failures, create a table with details
              if [ "$failed_tests" -gt 0 ]; then
                echo "### Failed Tests"
                echo ""
                echo "| Test Type | Package | Test | Elapsed | Runner Index | Logs |"
                echo "| --------- | ------- | ---- | ------- | ------------ | ---- |"
                cat "${failure_summary_file}"
                echo ""
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "failure_summary_created=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Create test results tarball
        if: always()
        id: create_test_results_tarball
        continue-on-error: true
        run: |
          mkdir -p /tmp/test-artifacts/test_results
          mkdir -p /tmp/test-artifacts/junit_results
          mkdir -p /tmp/test-artifacts/failure_summary

          if ls /tmp/vault_test_results_*.json 1> /dev/null 2>&1; then
            cp /tmp/vault_test_results_*.json /tmp/test-artifacts/test_results/
          fi

          if ls /tmp/vault_test_results_*.xml 1> /dev/null 2>&1; then
            cp /tmp/vault_test_results_*.xml /tmp/test-artifacts/junit_results/
          fi

          failure_summary_file="${{ steps.prepare_scenario.outputs.failure_summary_artifact_name }}"
          if [ "${{ steps.prepare_test_summary.outputs.failure_summary_created }}" == "true" ] && [ -f "$failure_summary_file" ]; then
            cp "$failure_summary_file" /tmp/test-artifacts/failure_summary/
          fi

          if [ -n "$(ls -A /tmp/test-artifacts/test_results 2>/dev/null)" ] || \
             [ -n "$(ls -A /tmp/test-artifacts/junit_results 2>/dev/null)" ] || \
             [ -n "$(ls -A /tmp/test-artifacts/failure_summary 2>/dev/null)" ]; then
            scenario_safe_name=$(echo "${{ matrix.scenario.id.filter }}" | sed -e 's/ /_/g' | sed -e 's/:/=/g')
            # Truncate to 215 chars to leave room for .tar.gz suffix and buffer
            tarball_name="test-results_${scenario_safe_name:0:215}.tar.gz"

            if tar -czf "/tmp/${tarball_name}" -C /tmp/test-artifacts .; then
              {
                echo "tarball_created=true"
                echo "tarball_name=${tarball_name}"
                echo "tarball_path=/tmp/${tarball_name}"
              } | tee -a "$GITHUB_OUTPUT"

              # Add artifact reference to step summary
              echo "" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "Full test results available in artifact: \`${tarball_name}\`" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Failed to create tarball"
              echo "tarball_created=false" | tee -a "$GITHUB_OUTPUT"
            fi
          else
            echo "tarball_created=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Upload test results tarball
        if: always() && steps.create_test_results_tarball.outputs.tarball_created == 'true'
        id: upload_test_results_tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.create_test_results_tarball.outputs.tarball_name }}
          path: ${{ steps.create_test_results_tarball.outputs.tarball_path }}
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

      - name: Clean up Enos runtime directories
        id: cleanup
        if: ${{ always() }}
        continue-on-error: true
        run: |
          rm -rf /tmp/enos*
          rm -rf ./enos/support
          rm -rf ./enos/.enos

      # Send slack notifications to #feed-vault-enos-failures any of our enos scenario commands fail.
      # There is an incoming webhook set up on the "Enos Vault Failure Bot" Slackbot:
      # https://api.slack.com/apps/A05E31CH1LG/incoming-webhooks

      - if: ${{ always() && ! cancelled() }}
        name: Notify launch failed
        uses: hashicorp/actions-slack-status@1a3f63b30bd476aee1f3bd6f9d8f2aacc4f14d81 # v2.0.1
        with:
          failure-message: "enos scenario launch ${{ matrix.scenario.id.filter}} failed. \nTriggering event: `${{ github.event_name }}` \nActor: `${{ github.actor }}`"
          status: ${{ steps.run-scenario.outputs.launch-outcome == 'failure' && 'failure' || 'success' }}
          slack-webhook-url: ${{ steps.secrets.outputs.slack-webhook-url }}

      - if: ${{ always() && ! cancelled() }}
        name: Notify retry launch failed
        uses: hashicorp/actions-slack-status@1a3f63b30bd476aee1f3bd6f9d8f2aacc4f14d81 # v2.0.1
        with:
          failure-message: "retry enos scenario launch ${{ matrix.scenario.id.filter}} failed. \nTriggering event: `${{ github.event_name }}` \nActor: `${{ github.actor }}`"
          status: ${{ steps.run-scenario.outputs.launch-retry-attempted == 'true' && steps.run-scenario.outputs.launch-outcome == 'failure' && 'failure' || 'success' }}
          slack-webhook-url: ${{ steps.secrets.outputs.slack-webhook-url }}

      - if: ${{ always() && ! cancelled() }}
        name: Notify destroy failed
        uses: hashicorp/actions-slack-status@1a3f63b30bd476aee1f3bd6f9d8f2aacc4f14d81 # v2.0.1
        with:
          failure-message: "enos scenario destroy ${{ matrix.scenario.id.filter}} failed. \nTriggering event: `${{ github.event_name }}` \nActor: `${{ github.actor }}`"
          status: ${{ steps.run-scenario.outputs.destroy-outcome == 'failure' && 'failure' || 'success' }}
          slack-webhook-url: ${{ steps.secrets.outputs.slack-webhook-url }}

      - if: ${{ always() && ! cancelled() }}
        name: Notify retry destroy failed
        uses: hashicorp/actions-slack-status@1a3f63b30bd476aee1f3bd6f9d8f2aacc4f14d81 # v2.0.1
        with:
          failure-message: "retry enos scenario destroy ${{ matrix.scenario.id.filter}} failed. \nTriggering event: `${{ github.event_name }}` \nActor: `${{ github.actor }}`"
          status: ${{ steps.run-scenario.outputs.destroy-retry-attempted == 'true' && steps.run-scenario.outputs.destroy-outcome == 'failure' && 'failure' || 'success' }}
          slack-webhook-url: ${{ steps.secrets.outputs.slack-webhook-url }}
